@if (href != null) {
	<a
		class="clickable-icon"
		[href]="href"
		target="_blank"
		rel="noopener noreferrer"
	>
		<ng-container *ngTemplateOutlet="iconTemplate"></ng-container>
	</a>
} @else {
	<button class="clickable-icon">
		<ng-container *ngTemplateOutlet="iconTemplate"></ng-container>
	</button>
}

<ng-template #iconTemplate>
	<sr-icon [iconName]="iconName"></sr-icon>
</ng-template>
