@if (
	{
		currentRootRoute: currentRootRoute$ | async,
	};
	as pageData
) {
	<div
		class="header flex-row flex-align-center flex-justify-space-between gap-15 pr-15"
	>
		<div class="flex-row flex-align-center">
			@for (
				routeMapping of navRouteMappings | keyvalue: originalOrder;
				track routeMapping
			) {
				<div
					class="header__tab flex-row flex-full-center gap-5"
					[ngClass]="{
						'header__tab--active':
							pageData.currentRootRoute == routeMapping.key,
					}"
					(click)="onNavTabClicked(routeMapping.key)"
				>
					<p class="html-bracket">{{ bracketString }}</p>
					<p>{{ routeMapping.value }}.html</p>
				</div>
			}
		</div>
		<div>
			<a
				href="https://www.linkedin.com/in/sryther/"
				target="_blank"
				rel="noopener noreferrer"
			>
				<img
					src="assets/images/linkedin/In-White-96.png"
					class="logo-icon"
				/>
			</a>
		</div>
	</div>
}
