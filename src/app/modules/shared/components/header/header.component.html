<ng-container *ngIf="{
    currentRootRoute: currentRootRoute$ | async
} as pageData">

    <div class="header">
        <div class="header__nav">
            <span
                *ngFor="let routeMapping of navRouteMappings | keyvalue : originalOrder"
                class="header__tab"
                [ngClass]="{'header__tab--active': pageData.currentRootRoute == routeMapping.key}"
                (click)="onNavTabClicked(routeMapping.key)">
                <p class="html-bracket">{{bracketString}}</p>
                <p>{{routeMapping.value}}.html</p>
            </span>
        </div>

        <div>
            <a href="https://www.linkedin.com/in/sryther/" target="_blank" rel="noopener noreferrer">
                <img src="../../../../../assets/images/linkedin/In-White-96.png" class="logo-icon">
            </a>
        </div>
    </div>
    
</ng-container>
